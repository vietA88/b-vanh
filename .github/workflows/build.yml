name: Build Fabric Mods

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Fabric project
        run: |
          mkdir -p src/main/java/autosand src/main/resources
          cp AutoSandOrders.java src/main/java/autosand/
          cp AutoMiner.java src/main/java/autosand/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'AutoSandOrders'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }
          version = '1.0.0'
          group = 'autosand'

          dependencies {
              minecraft 'com.mojang:minecraft:1.21.11'
              mappings loom.officialMojangMappings()
              modImplementation 'net.fabricmc:fabric-loader:0.18.1'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "autosand",
            "version": "1.0.0",
            "name": "AutoSandOrders",
            "environment": "client",
            "entrypoints": {
              "client": ["autosand.AutoSandOrders"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mods
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSandOrders-JAR
          path: build/libs/*.jar
          if-no-files-found: error
