name: Build AutoSand JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: ls -la

      - name: Build JAR
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle build --no-daemon
          else
            echo "ERROR: Khong tim thay build.gradle, build.gradle.kts hoac gradlew"
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoSand-JAR
          path: build/libs/*.jar
          if-no-files-found: error
