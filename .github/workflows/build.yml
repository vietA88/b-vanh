name: Build Java to JAR

on:
workflow_dispatch:
push:
branches: [main]

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download source
    uses: actions/checkout@v4
  - name: Install Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
  - name: Compile Java and create JAR
    run: |
      mkdir -p out
      find . -name "*.java" -not -path "./.git/*" > sources.txt
      test -s sources.txt
      javac -d out @sources.txt
      jar cf MyJava.jar -C out .
  - name: Upload JAR
    uses: actions/upload-artifact@v4
    with:
      name: MyJava-JAR
      path: MyJava.jar
