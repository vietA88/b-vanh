name: Build AutoMiner

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare source files
        run: |
          mkdir -p src/main/java/autosand
          mkdir -p src/main/resources

          cp AutoSandOrders.java src/main/java/autosand/
          cp AutoMiner.java src/main/java/autosand/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven {
                      url = 'https://maven.fabricmc.net/'
                  }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'AutoMiner'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = '1.0.0'
          group = 'autosand'

          base {
              archivesName = 'AutoMiner'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft 'com.mojang:minecraft:1.21.11'
              mappings loom.officialMojangMappings()
              modImplementation 'net.fabricmc:fabric-loader:0.18.1'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
          }

          java {
              toolchain {
                  languageVersion = JavaLanguageVersion.of(21)
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.parallel=true
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "autominer",
            "version": "1.0.0",
            "name": "AutoMiner",
            "environment": "client",
            "entrypoints": {
              "client": ["autosand.AutoSandOrders"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload AutoMiner JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoMiner-JAR
          path: build/libs/*.jar
          if-no-files-found: error
