name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoSand-JAR
          path: build/libs/*.jar
          if-no-files-found: error
:::

### Cách lấy file JAR trên điện thoại
1. Vào GitHub → repository của bạn.
2. Mở tab **Actions**.
3. Chọn workflow **Build Minecraft Mod**.
4. Chờ chạy xong, trạng thái phải là dấu tích xanh ✅.
5. Kéo xuống mục **Artifacts**, nhấn `AutoSand-JAR` để tải file `.jar`.

**Lưu ý:** Lỗi `duplicate class: autosand.AutoMiner` trước đó phải được sửa trước thì mới build thành công. Workflow này chỉ biên dịch và đóng gói code, không tự sửa lỗi Java.
